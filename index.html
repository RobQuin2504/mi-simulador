<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Estilos de Toastify -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Librería Toastify -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <!-- Librería SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- JS -->
  <script defer src="js/main.js"></script>
  <script defer src="js/admin.js"></script>
  <script defer src="js/cliente.js"></script>

  <title>Mi Simulador</title>
</head>

<body>
  <header>
    <h1 id="titulo">Venta de productos de electrónica</h1>

    <!-- Navegación entre vistas -->
    <nav id="navegacion">
      <button type="button" id="btn-admin">
        Administrador
      </button>

      <button type="button" id="btn-cliente">
        Cliente
      </button>
    </nav>
  </header>

  <main>
    <!-- Vista admin -->
    <section id="vista-admin">
      <h2>Panel de administración</h2>

      <div id="formularios">
        <!-- Formulario para agregar productos -->
        <form id="form-agregacion">
          <h3>Agregar un producto</h3>

          <label for="nombre">Nombre:
            <input type="text" name="nombre" id="nombre">
          </label>

          <label for="precio">Precio:
            <input type="number" name="precio" id="precio" min="0.01" step="0.01">
          </label>

          <label for="stock">Stock:
            <input type="number" name="stock" id="stock" min="1" max="20" step="1">
          </label>

          <label for="descripcion">Descripción:
            <input type="text" name="descripcion" id="descripcion">
          </label>

          <label for="imagen">Imagen:
            <input type="text" name="imagen" id="imagen" placeholder="img/producto.jpg" required>
          </label>

          <button type="button" id="btn-agregar">Agregar +</button>
        </form>
      </div>

      <!-- Buscador -->
      <div id="contenedor-busqueda">
        <h3>Buscar un producto</h3>
        <input type="search" name="buscar" id="buscar" placeholder="Nombre del producto">
      </div>

      <!-- Listado de productos -->
      <div id="contenedor-items">
        <h3>Listado de productos</h3>
        <div id="listado-productos"></div>
      </div>

      <button type="button" id="btn-vaciar-listado">
        Vaciar listado
      </button>
    </section>

    <!-- Vista cliente -->
    <section id="vista-cliente" hidden>
      <h2>Catálogo de productos</h2>
      <p>
        Explora nuestros productos y agrega los que quieras
        comprar a tu carrito.
      </p>

      <!-- Buscador -->
      <div id="contenedor-busqueda-cliente">
        <label for="buscar-cliente">
          Buscar un producto
        </label>
        <input type="search" id="buscar-cliente" placeholder="Nombre del producto">
      </div>

      <!-- Listado de productos disponibles -->
      <div id="catalogo-productos"></div>

      <!-- Carrito -->
      <section id="seccion-carrito">
        <h2>Mi carrito</h2>

        <div id="carrito"></div>

        <div id="resumen-carrito">
          <p>
            Total de productos:
            <span id="cantidad-total">0</span>
          </p>

          <h3>
            Total a pagar: <span id="total">$0.00</span>
          </h3>
        </div>

        <div id="acciones-carrito">
          <button type="button" id="btn-vaciar-carrito">
            Vaciar carrito
          </button>

          <button type="button" id="btn-confirmar">
            Confirmar compra
          </button>
        </div>
      </section>
    </section>
  </main>
</body>

</html>
