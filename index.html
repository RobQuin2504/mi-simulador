<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Estilos de Toastify -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Librería Toastify -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <!-- JS -->
  <script defer src="js/main.js"></script>

  <title>Pre-entrega10</title>
</head>

<body>
  <h1 id="titulo">Venta de productos de electrónica</h1>

  <div id="formularios">
    <form action="" id="form-agregacion">
      <h2>Agregar un producto</h2>

      <label for="nombre">Nombre:
        <input type="text" name="nombre" id="nombre">
      </label>

      <label for="precio">Precio:
        <input type="number" name="precio" id="precio">
      </label>

      <label for="stock">Stock:
        <input type="number" name="stock" id="stock" min="1" max="20">
      </label>

      <label for="descripcion">Descripción:
        <input type="text" name="descripcion" id="descripcion">
      </label>

      <button type="button" id="btn-agregar">Agregar +</button>
    </form>

    <div id="contenedor-busqueda">
      <h2>Buscar un producto</h2>

      <input type="text" name="buscar" id="buscar" placeholder="Nombre del producto">
    </div>
  </div>

  <div id="contenedor-items">
    <h2>Listado de productos</h2>
  </div>

  <div>
    <button id="btn-vaciar-listado">Vaciar listado</button>
  </div>

  <div id="modal-bienvenida">
    <div id="contenido-modal">
      <h2>¡Bienvenido!</h2>

      <p>
        Puedes agregar productos, consultar su stock y eliminarlos del listado.
      </p>

      <p>
        Recuerda: el stock permitido para nuevos productos es de 1 a 20 unidades.
      </p>
    </div>
  </div>


  <!-- <div id="contenedor-notificaciones">
    <p id="notificacion"></p>
  </div> -->
</body>

</html>
